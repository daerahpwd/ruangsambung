<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Sambung</title>
<meta name="theme-color" content="#14233F" id="themeColor">
<meta name="description" content="Pendataan jamaah dan absensi kegiatan Daerah Purwodadi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>/* cegah kedip tema: terapkan mode tersimpan sebelum render */
(function(){try{var m=localStorage.getItem('rs_theme')||'system';var d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.mode=d?'dark':'light'}catch(e){}})();</script>
</head>
<body data-shell="bare" data-fab="0">
<div id="offline">Anda sedang offline — menampilkan data tersimpan</div>
<header id="topbar">
  <div class="t"><small id="tbSub">RUANG SAMBUNG</small><span id="tbTitle">Beranda</span></div>
  <button class="tb" id="btnAI" title="Asisten AI" hidden></button>
  <button class="tb" id="btnTheme" title="Ganti tema"></button>
</header>
<main id="view" aria-live="polite"></main>
<button id="fab" aria-label="Buat kegiatan"></button>
<nav id="nav" aria-label="Menu utama"></nav>
<div id="toasts"></div>
<div id="sheet"><div class="box"><div class="grip"></div><div id="sheetBody"></div></div></div>
<noscript>Aplikasi memerlukan JavaScript.</noscript>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
